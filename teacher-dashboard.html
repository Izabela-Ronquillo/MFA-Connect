<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Dashboard | MFA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal-shared.css">
</head>
<body>
<div id="errbar"></div>
<section id="dash" class="app">
  <aside class="side"><div class="brand"><div class="crest"><i>MFA</i></div><span>Marvelous<br>Faith Academy</span></div><nav id="nav"></nav>
  <div class="me"><b id="mn"></b><div class="role" id="mr"></div><span id="mid"></span><button class="btn o sm" id="out">Sign Out</button></div></aside>
  <main><div class="hd"><div><h2 id="ttl">Loading…</h2><p id="subh"></p></div><button class="btn o sm noprint" onclick="window.print()">Print</button></div><div id="flash"></div><div id="views"></div></main>
</section>
<script>
/* ---- on-screen error reporting ---- */
window.onerror=function(msg,src,line){var b=document.getElementById('errbar');b.style.display='block';b.textContent+='Error: '+msg+' (line '+line+')\n'};

/* ---- helpers ---- */
var LOGIN='student-portal-mfa.html';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};
var mem={};
function sget(st,k){try{return window[st].getItem(k)}catch(e){return mem[st+k]||null}}
function sset(st,k,v){try{window[st].setItem(k,v)}catch(e){mem[st+k]=v}}
function sdel(st,k){try{window[st].removeItem(k)}catch(e){delete mem[st+k]}}
function flash(msg,type){var el=$('flash');el.innerHTML=msg?'<div class="msg '+(type||'ok')+'">'+esc(msg)+'</div>':'';if(msg)setTimeout(function(){el.innerHTML=''},3500)}

/* ---- data ---- */
var DEFAULT={school:{name:'Marvelous Faith Academy',tagline:'Keep the Faith Alive!'},
 accounts:[{id:'admin-001',pw:'admin123',role:'admin',name:'Ms. Angela Reyes',first:false},{id:'registrar-001',pw:'registrar123',role:'registrar',name:'Mrs. Liza Bautista',first:false},{id:'cashier-001',pw:'cashier123',role:'cashier',name:'Mr. Carlo Santos',first:false},{id:'teacher-001',pw:'teacher123',role:'teacher',name:'Mr. Roberto Garcia',subject:'Mathematics',first:false},{id:'2023-0142',pw:'temp1234',role:'student',name:'Juan Miguel Dela Cruz',level:'Grade 8 \u2013 St. Matthew',sy:'2025\u20132026',adviser:'Mr. Roberto Garcia',first:false}],
 students:{},
 teacherSched:[['7:30 \u2013 8:30 AM','Mathematics 8','Grade 8 \u2013 St. Matthew','Rm 201','Mon \u2013 Fri'],['8:30 \u2013 9:30 AM','Math Remediation','Grade 8 \u2013 St. Mark','Rm 202','Tue \u00B7 Thu']],
 gradeQueue:[{id:1,studentId:'2023-0142',student:'Juan Miguel Dela Cruz',subject:'Mathematics',quarter:2,grade:87,teacher:'Mr. Roberto Garcia',status:'pending',sy:'2025\u20132026'}],
 documents:[],teacherAssignments:[],_seq:10};
function loadDB(){
  var base=JSON.parse(JSON.stringify(DEFAULT)),d=null;
  try{d=JSON.parse(sget('localStorage','mfa_portal_db')||'null')}catch(e){}
  if(!d||!d.accounts)return base;
  for(var k in base){if(d[k]==null)d[k]=base[k]}
  base.accounts.forEach(function(a){if(!d.accounts.some(function(x){return x.id===a.id}))d.accounts.push(a)});
  return d;
}
function saveDB(){sset('localStorage','mfa_portal_db',JSON.stringify(DB))}
var DB=loadDB(),me=null;
function acctById(id){for(var i=0;i<DB.accounts.length;i++){if(DB.accounts[i].id===id)return DB.accounts[i]}return null}

/* ---- shell ---- */
function setMain(t,s,h){$('ttl').textContent=t;$('subh').textContent=s||'';$('views').innerHTML=h}
function ban(){return '<div class="c ban s6"><h3>'+esc(me.role.toUpperCase())+'</h3><h2>'+esc(me.name)+'</h2><p>'+esc(me.subject||DB.school.name)+'</p><p>'+esc(DB.school.tagline||'')+'</p></div>'}
function openView(v){
  var els=document.querySelectorAll('.nv');
  for(var i=0;i<els.length;i++)els[i].classList.toggle('on',els[i].getAttribute('data-v')===v);
  try{VIEWS[v]()}catch(e){setMain('Error','','<div class="c"><div class="msg err">'+esc(e.message)+'</div></div>')}
}
function signOut(){sdel('sessionStorage','mfa_session');location.href=LOGIN}

/* ---- teacher views ---- */
var NAV=[['t_home','\u2302','Overview'],['t_sched','\u25F7','Schedule'],['t_upload','\u2605','Upload Grades'],['t_attend','\u2713','Attendance'],['t_advise','\u2605','My Advised Students']];
function t_home(){
  var pend=DB.gradeQueue.filter(function(g){return g.teacher===me.name&&g.status==='pending'}).length;
  setMain('Teacher Dashboard','Manage classes and submit grades','<div class="bento">'+ban()+'<div class="c s3"><h3>Pending validation</h3><div class="big">'+pend+'</div><div class="cap">grades awaiting registrar</div></div><div class="c s3"><h3>Class blocks</h3><div class="big">'+DB.teacherSched.length+'</div></div></div>');
}
function t_sched(){
  setMain('Class Schedule','Your assigned classes','<div class="c"><div class="tl2">'+DB.teacherSched.map(function(x){return '<div class="ev"><small>'+esc(x[0])+' \u00B7 '+esc(x[4])+'</small><b>'+esc(x[1])+'</b><span>'+esc(x[2])+' \u00B7 '+esc(x[3])+'</span></div>'}).join('')+'</div></div>');
}
function t_upload(){
  var students=DB.accounts.filter(function(a){return a.role==='student'&&a.adviser===me.name});
  var opts=students.map(function(s){return '<option value="'+esc(s.id)+'">'+esc(s.name)+' ('+esc(s.id)+')</option>'}).join('');
  var mine=DB.gradeQueue.filter(function(g){return g.teacher===me.name});
  var rows=mine.length?mine.map(function(g){return '<tr><td>'+esc(g.student)+'</td><td>'+esc(g.subject)+'</td><td>'+g.quarter+'</td><td>'+g.grade+'</td><td><span class="tag '+(g.status==='pending'?'pend':g.status==='approved'?'ok':'bad')+'">'+esc(g.status)+'</span></td></tr>'}).join(''):'<tr><td colspan="5" class="na">No submissions.</td></tr>';
  setMain('Upload Grades','Submitted grades must be validated by the registrar before students see them',
   '<div class="c"><h3>Submit grade for your advised students</h3><div class="row"><div><label>Student</label><select id="tg_st">'+(opts||'<option>No advised students</option>')+'</select></div><div><label>Subject</label><input id="tg_sub" value="'+esc(me.subject||'')+'"></div><div><label>Quarter</label><select id="tg_q"><option value="1">Q1</option><option value="2">Q2</option><option value="3">Q3</option><option value="4">Q4</option></select></div><div><label>Grade</label><input id="tg_g" type="number" min="60" max="100" placeholder="60-100"></div></div><button class="btn sm" onclick="submitGrade()">Send to Registrar</button></div>'+
   '<div class="c" style="margin-top:1rem"><h3>Your submissions</h3><table class="tbl"><thead><tr><th>Student</th><th>Subject</th><th>Q</th><th>Grade</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>');
}
function t_attend(){
  var students=DB.accounts.filter(function(a){return a.role==='student'&&a.adviser===me.name});
  var today=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  var rows=students.length?students.map(function(s){
    var st=DB.students[s.id]||{att:[]};
    var existing=st.att.find(function(a){return a[0]===today});
    var sel=existing?existing[1]:'';
    return '<tr><td><b>'+esc(s.id)+'</b></td><td>'+esc(s.name)+'</td><td><select class="att-sel" data-sid="'+esc(s.id)+'"><option value="">--</option><option value="Present" '+(sel==='Present'?'selected':'')+'>Present</option><option value="Absent" '+(sel==='Absent'?'selected':'')+'>Absent</option><option value="Late" '+(sel==='Late'?'selected':'')+'>Late</option></select></td><td><button class="btn sm" onclick="saveAttend(\''+esc(s.id)+'\',\''+today+'\')">Save</button></td></tr>';
  }).join(''):'<tr><td colspan="4" class="na">No advised students.</td></tr>';
  setMain('Attendance','Mark attendance for '+today,'<div class="c"><table class="tbl"><thead><tr><th>ID</th><th>Student</th><th>Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>');
}
function saveAttend(sid,date){
  var sel=document.querySelector('.att-sel[data-sid="'+sid+'"]');
  var status=sel?sel.value:'';
  if(!status){flash('Select a status.','err');return}
  var st=DB.students[sid];
  if(!st){st={att:[]};DB.students[sid]=st}
  if(!st.att)st.att=[];
  var idx=st.att.findIndex(function(a){return a[0]===date});
  if(idx>=0)st.att[idx][1]=status;else st.att.push([date,status]);
  saveDB();flash('Attendance saved.');t_attend();
}
function t_advise(){
  var students=DB.accounts.filter(function(a){return a.role==='student'&&a.adviser===me.name});
  setMain('My Advised Students','Students assigned to you as adviser','<div class="c"><table class="tbl"><thead><tr><th>ID</th><th>Name</th><th>Level/Section</th><th>SY</th></tr></thead><tbody>'+(students.length?students.map(function(s){return '<tr><td><b>'+esc(s.id)+'</b></td><td>'+esc(s.name)+'</td><td>'+esc(s.level||'Unassigned')+'</td><td>'+esc(s.sy||'')+'</td></tr>'}).join(''):'<tr><td colspan="4" class="na">No advised students.</td></tr>')+'</tbody></table></div>');
}
function submitGrade(){
  var sid=$('tg_st').value,sub=$('tg_sub').value.trim(),q=+$('tg_q').value,g=+$('tg_g').value,stu=acctById(sid);
  if(!stu||!sub||!(g>=60&&g<=100)){flash('Select student, subject, and grade (60-100).','err');return}
  DB.gradeQueue.push({id:++DB._seq,studentId:sid,student:stu.name,subject:sub,quarter:q,grade:g,teacher:me.name,status:'pending',sy:stu.sy||'2025\u20132026'});
  saveDB();t_upload();flash('Grade sent to registrar for validation.');
}
var VIEWS={t_home:t_home,t_sched:t_sched,t_upload:t_upload,t_attend:t_attend,t_advise:t_advise};

/* ---- start ---- */
$('out').onclick=signOut;
$('nav').innerHTML=NAV.map(function(n,i){return '<button class="nv'+(i===0?' on':'')+'" data-v="'+n[0]+'"><b>'+n[1]+'</b>'+n[2]+'</button>'}).join('');
$('nav').onclick=function(e){var b=e.target;while(b&&b!==this&&!b.classList.contains('nv'))b=b.parentNode;if(b&&b.classList.contains('nv'))openView(b.getAttribute('data-v'))};

var sess=null;try{sess=JSON.parse(sget('sessionStorage','mfa_session')||'null')}catch(e){}
var acct=sess&&acctById(sess.id);
function startPortal(){
  me=acct;$('mn').textContent=me.name;$('mr').textContent='Teacher';$('mid').textContent=me.id;
  $('nav').style.display='';openView('t_home');
}
function changePw(){
  var a=$('np1').value,b=$('np2').value;
  if(a.length<8){flash('Password must be at least 8 characters.','err');return}
  if(a===acct.pw){flash('New password must be different from the temporary password.','err');return}
  if(a!==b){flash('Passwords do not match.','err');return}
  acct.pw=a;acct.first=false;saveDB();
  startPortal();flash('Password updated. Welcome!');
}
if(acct&&acct.role==='teacher'&&acct.first){
  $('mn').textContent=acct.name;$('mr').textContent='Teacher';$('mid').textContent=acct.id;
  $('nav').style.display='none';
  setMain('Set Your Password','You are using a temporary password. Create a new one to continue.','<div class="c" style="max-width:520px"><h3>Change password</h3><div class="row"><div><label>New password</label><input id="np1" type="password" placeholder="At least 8 characters"></div><div><label>Confirm new password</label><input id="np2" type="password" placeholder="Re-enter password"></div></div><button class="btn sm" onclick="changePw()">Save &amp; Continue</button></div>');
}else if(acct&&acct.role==='teacher'){
  startPortal();
}else{
  setMain('Not signed in','','<div class="c"><div class="msg err">No teacher session found (session: '+esc(JSON.stringify(sess))+'). Sign in as a teacher from <a href="'+LOGIN+'" style="color:#f0d060">'+LOGIN+'</a> (teacher-001 / teacher123).</div></div>');
}
</script>
<script src="portal-shared.js"></script>
</body>
</html>
